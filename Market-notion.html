<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Market — SNS自動化ツール</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Disable Tailwind preflight margins on h1 etc; we want explicit control.
  tailwind.config = {
    theme: { extend: {} },
    corePlugins: { preflight: true },
  };
</script>

<style>
  /* ── Design tokens (light) ────────────────────────────────────────────── */
  :root {
    --mkt-bg-app:       #FFFFFF;
    --mkt-bg-surface:   #FFFFFF;
    --mkt-bg-sunken:    #F7F7F5;
    --mkt-bg-hover:     #F1F1EF;

    --mkt-fg-1:         #37352F;  /* primary body / headings */
    --mkt-fg-2:         #6B6B66;  /* secondary */
    --mkt-fg-3:         #9B9A93;  /* tertiary / meta */
    --mkt-fg-4:         #C2C0B7;  /* very faint */

    --mkt-border:        #E9E9E7;
    --mkt-border-strong: #DCDBD8;

    --mkt-accent:        #2383E2;
    --mkt-accent-hover:  #1A6FC4;
    --mkt-accent-soft:   rgba(35,131,226,0.10);
    --mkt-fg-on-accent:  #FFFFFF;
  }

  /* ── Dark mode ────────────────────────────────────────────────────────── */
  html[data-theme="dark"] {
    --mkt-bg-app:       #191919;
    --mkt-bg-surface:   #1F1F1F;
    --mkt-bg-sunken:    #252525;
    --mkt-bg-hover:     #2A2A2A;

    --mkt-fg-1:         #E6E6E2;
    --mkt-fg-2:         #A5A39C;
    --mkt-fg-3:         #777570;
    --mkt-fg-4:         #4A4844;

    --mkt-border:        #2F2F2D;
    --mkt-border-strong: #3A3A37;

    --mkt-accent-soft:   rgba(35,131,226,0.18);
  }

  html, body { background: var(--mkt-bg-app); }

  body {
    font-family: 'Inter', 'Noto Sans JP', ui-sans-serif, system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    color: var(--mkt-fg-1);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "palt";
  }

  .font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; }

  /* ── Semantic utility classes (tokens → utilities) ─────────────────────
       Tailwind's arbitrary syntax doesn't compose well with our token names,
       so we define short utility classes here. */

  .mkt-bg-app      { background-color: var(--mkt-bg-app); }
  .mkt-bg-surface  { background-color: var(--mkt-bg-surface); }
  .mkt-bg-sunken   { background-color: var(--mkt-bg-sunken); }
  .mkt-bg-hover:hover { background-color: var(--mkt-bg-hover); }
  .hover\:mkt-bg-hover:hover  { background-color: var(--mkt-bg-hover); }
  .hover\:mkt-bg-sunken:hover { background-color: var(--mkt-bg-sunken); }

  .mkt-bg-1        { background-color: var(--mkt-fg-1); }
  .mkt-bg-accent   { background-color: var(--mkt-accent); }
  .mkt-accent-hover:hover { background-color: var(--mkt-accent-hover); }
  .mkt-accent-soft { background-color: var(--mkt-accent-soft); color: var(--mkt-accent); }

  .mkt-fg-1 { color: var(--mkt-fg-1); }
  .mkt-fg-2 { color: var(--mkt-fg-2); }
  .mkt-fg-3 { color: var(--mkt-fg-3); }
  .mkt-fg-4 { color: var(--mkt-fg-4); }
  .mkt-fg-accent { color: var(--mkt-accent); }
  .mkt-fg-on-accent { color: var(--mkt-fg-on-accent); }
  .hover\:mkt-fg-1:hover { color: var(--mkt-fg-1); }

  .mkt-border          { border: 1px solid var(--mkt-border); }
  .mkt-border-strong   { border: 1px solid var(--mkt-border-strong); }
  .mkt-border-t        { border-top: 1px solid var(--mkt-border); }
  .mkt-border-b        { border-bottom: 1px solid var(--mkt-border); }
  .mkt-border-y        { border-top: 1px solid var(--mkt-border); border-bottom: 1px solid var(--mkt-border); }

  /* Anchored sections need scroll offset under the sticky header */
  section[id] { scroll-margin-top: 64px; }

  /* Selection */
  ::selection { background: var(--mkt-accent-soft); color: var(--mkt-fg-1); }

  /* Subtle focus ring */
  :focus-visible {
    outline: 2px solid var(--mkt-accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
</style>
</head>

<body>

<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>

</body>
</html>
