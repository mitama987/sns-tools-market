<script src="https://cdn.tailwindcss.com"></script>

<style>
  html, body {
    background: #F2EDE3;
  }

  body {
    /* Amazon-like type stack: Arial-first, Noto for JP */
    font-family: "Amazon Ember", "Noto Sans JP", Arial, "Helvetica Neue", Helvetica, sans-serif;
    color: #0F1111;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "palt";
  }

  .font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; }

  /* Allow long product titles to truncate cleanly */
  .line-clamp-1 {
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Anchored sections need scroll offset under sticky nav (none here, but keep) */
  section[id] { scroll-margin-top: 16px; }

  /* Selection */
  ::selection { background: #F1DDB8; color: #1F1B16; }

  /* Focus ring */
  :focus-visible {
    outline: 2px solid #C2533C;
    outline-offset: 2px;
  }

  /* Smoother scrollbar for filter overflow */
  .nav-scroll::-webkit-scrollbar { display: none; }
</style>
</head>
