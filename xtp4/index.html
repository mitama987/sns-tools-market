<style>
  :root { color-scheme: dark; }
  html, body {
    background: #0A0D1F;
    font-family: 'Inter', 'Noto Sans JP', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #fff;
  }
  body {
    background:
      radial-gradient(1200px 800px at 80% -10%, rgba(107,71,224,0.18), transparent 60%),
      radial-gradient(900px 700px at -10% 30%, rgba(139,92,246,0.12), transparent 60%),
      linear-gradient(180deg, #0E0B1B 0%, #0A0D1F 40%, #131523 100%);
    background-attachment: fixed;
  }
  .grid-overlay {
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%);
  }
  .text-balance { text-wrap: balance; }
  .text-pretty { text-wrap: pretty; }
  /* Phone frame */
  .phone-frame {
    position: relative;
    border-radius: 3rem;
    padding: 12px;
    background: linear-gradient(160deg, #1a1d2e 0%, #0d0f1c 100%);
    box-shadow:
      0 30px 80px -20px rgba(107,71,224,0.45),
      0 10px 30px -10px rgba(0,0,0,0.6),
      inset 0 0 0 1px rgba(255,255,255,0.06),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .phone-frame::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(135deg, rgba(139,92,246,0.6), rgba(107,71,224,0.0) 40%, rgba(139,92,246,0.4) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }
  .phone-screen {
    border-radius: 2.2rem;
    overflow: hidden;
    background: #000;
    position: relative;
    aspect-ratio: 1290 / 2796;
  }
  .phone-notch {
    position: absolute;
    top: 10px; left: 50%; transform: translateX(-50%);
    width: 38%; height: 22px;
    background: #000;
    border-radius: 999px;
    z-index: 2;
  }
  .phone-glow {
    position: absolute;
    inset: -20% -10% -10% -10%;
    background: radial-gradient(60% 50% at 50% 60%, rgba(139,92,246,0.35), transparent 70%);
    filter: blur(40px);
    z-index: -1;
    pointer-events: none;
  }
  .btn-grad {
    background-image: linear-gradient(135deg, #6B47E0 0%, #8B5CF6 100%);
    box-shadow: 0 10px 30px -10px rgba(107,71,224,0.6), inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .btn-grad:hover { filter: brightness(1.08); }
  .ring-focus:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(139,92,246,0.55); }
  .glass {
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
  }
  .gradient-text {
    background: linear-gradient(135deg, #C4B5FD 0%, #8B5CF6 60%, #6B47E0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .h-display { font-family: 'Inter', 'Noto Sans JP', sans-serif; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .hairline { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent); height: 1px; }
  @keyframes floaty {
    0%,100% { transform: translateY(0) rotate(var(--r,0deg)); }
    50%     { transform: translateY(-10px) rotate(var(--r,0deg)); }
  }
  .floaty { animation: floaty 6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(6px)} }
  .bob { animation: bob 2s ease-in-out infinite; }
  /* hide scrollbar on logo strip */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
